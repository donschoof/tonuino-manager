name: Build

# Baut Tonuino-Manager auf Windows, Linux und macOS und macht damit den
# plattformuebergreifenden Support tatsaechlich ueberpruefbar (PyInstaller
# kompiliert nicht plattformuebergreifend - ein Windows-Build allein sagt
# nichts darueber aus, ob die App auf Linux/macOS funktioniert).
#
# Der Linux-Job baut nicht nur, sondern startet die App zusaetzlich headless
# (via xvfb) und instanziiert das Hauptfenster, um fehlende Systembibliotheken
# (Qt xcb-Plugin, PC/SC) fruehzeitig zu erkennen. Der macOS-Job macht denselben
# Smoketest ohne xvfb (der WindowServer ist auf den Runnern bereits vorhanden).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: System-Abhaengigkeiten installieren (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          # pcscd/libpcsclite-dev: PC/SC-Stack fuer pyscard (RFID-Reader-Zugriff)
          # swig: wird von pyscard benoetigt, falls aus dem Quellcode gebaut wird
          # libxcb-cursor0 & Co: Qt6 "xcb"-Plattform-Plugin (haeufigste Ursache
          #   fuer "could not load the Qt platform plugin" auf frischen Linux-Systemen)
          # libpulse0: Laufzeit-Abhaengigkeit von QtMultimedia (Audio-Player) -
          #   ohne sie schlaegt schon der Import von PyQt6.QtMultimedia fehl
          # xvfb: virtueller Display-Server fuer den headless GUI-Smoketest
          sudo apt-get install -y \
            pcscd libpcsclite-dev libpcsclite1 swig \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libegl1 \
            libpulse0 \
            xvfb

      - name: Python-Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build ausfuehren
        run: python build_exe.py

      # Beide Smoketests lassen die Event-Loop kurz laufen (app.exec() statt
      # nur processEvents()) und schliessen das Fenster ueber window.close(),
      # bevor der Prozess endet - damit durchlaeuft QMediaPlayer/QAudioOutput
      # (Audio-Player) denselben Qt-eigenen Init-/Teardown-Pfad wie im echten
      # Programmablauf. Ohne laufende Event-Loop wird auf macOS das native
      # CoreAudio-Backend nie sauber initialisiert und stuerzt beim abrupten
      # Prozessende (CPython-GC-Reihenfolge statt Qt-Objektbaum-Teardown) mit
      # einem Segfault ab (kein Problem fuer echte Nutzer, die immer app.exec()
      # durchlaufen - nur ein Artefakt eines zu kurzen Smoketests).
      - name: Headless-Smoketest (Linux)
        if: matrix.name == 'linux'
        run: |
          xvfb-run --auto-servernum python -c "
          import sys
          sys.path.insert(0, 'src')
          from PyQt6.QtWidgets import QApplication
          from PyQt6.QtCore import QTimer
          app = QApplication(sys.argv)
          from gui.styles import MAIN_STYLESHEET
          app.setStyleSheet(MAIN_STYLESHEET)
          from gui.main_window import MainWindow
          window = MainWindow()
          window.show()
          print('MainWindow erfolgreich erstellt und angezeigt - kein Crash.')
          QTimer.singleShot(500, window.close)
          QTimer.singleShot(700, app.quit)
          sys.exit(app.exec())
          "

      - name: Headless-Smoketest (macOS)
        if: matrix.name == 'macos'
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from PyQt6.QtWidgets import QApplication
          from PyQt6.QtCore import QTimer
          app = QApplication(sys.argv)
          from gui.styles import MAIN_STYLESHEET
          app.setStyleSheet(MAIN_STYLESHEET)
          from gui.main_window import MainWindow
          window = MainWindow()
          window.show()
          print('MainWindow erfolgreich erstellt und angezeigt - kein Crash.')
          QTimer.singleShot(500, window.close)
          QTimer.singleShot(700, app.quit)
          sys.exit(app.exec())
          "

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v7
        with:
          name: tonuino-manager-${{ matrix.name }}
          path: |
            dist/*
          if-no-files-found: error
